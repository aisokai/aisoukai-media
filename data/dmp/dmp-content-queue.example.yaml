# --- スキーマ定義 ---
#
# id:              DMP-YYYY-NNNN 形式。一意に識別する
# channel:         blog / sns / website / youtube
# title:           コンテンツタイトル（案）
# category:        コンテンツカテゴリ
# status:          上記 status フィールド参照
# assigned_to:     担当部門 ID（dmp-departments.yaml の id）
# priority:        high / medium / low
# medical_risk:    high / medium / low（医療広告リスク）
# target_keyword:  SEO 対象キーワード（null 可）
# patient_intent:  患者の検索意図
# created_at:      YYYY-MM-DD
# reviewed_by:     承認者名（Human のみ。null = 未承認）
# reviewed_at:     承認日（YYYY-MM-DD。null = 未承認）
# notes:           運用メモ
# related_post:    対応する記事ファイル名（content/posts/ 配下）
